[workspace]
resolver = "2"
members = [
    "plugins/lemon-vocal",
    "crates/os-model",
    "crates/os-plugkit",
    "crates/os-ui",
    "crates/os-theme",
    "crates/os-paths",
    "crates/os-hostlink",
    "tools/bundle-plugins",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
os-model = { path = "crates/os-model" }
os-hostlink = { path = "crates/os-hostlink" }
os-paths = { path = "crates/os-paths" }

[profile.dev]
opt-level = 3
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
